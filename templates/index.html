<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Recommender</title>
  <style>
    body { font-family: Arial, sans-serif; background:#141414; color:#eee; display:flex; justify-content:center; padding:40px 16px; }
    .box { width:100%; max-width:520px; }
    h1 { color:#e50914; }
    select, button { width:100%; padding:12px; font-size:16px; margin-top:10px; border-radius:6px; border:none; }
    button { background:#e50914; color:#fff; cursor:pointer; }
    button:hover { background:#b20710; }
    ul { list-style:none; padding:0; }
    li { background:#222; margin:8px 0; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎬 Movie Recommender</h1>
    <form action="/recommend" method="POST">
      <select name="movie">
        {% for t in titles %}
          <option value="{{ t }}" {% if t == selected %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
      <button type="submit">Recommend</button>
    </form>
    {% if recommendations %}
      <h2>Because you picked "{{ selected }}":</h2>
      <ul>{% for r in recommendations %}<li>{{ r }}</li>{% endfor %}</ul>
    {% endif %}
  </div>
</body>
</html>
